<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Weihnachts-Uhren-Swipe</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-2: #20242e;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --like: #22c55e;
      --nope: #ef4444;
      --accent: #f59e0b;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1b202c 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 17, 21, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand strong {
      font-size: 1rem;
      letter-spacing: 0.2px;
    }

    .round-pill {
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: inherit;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button.primary {
      background: var(--accent);
      color: #111;
      border-color: transparent;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .progress-wrap {
      width: 100%;
      margin-bottom: 14px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 6px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #fbbf24);
      width: 0%;
      transition: width 0.25s ease;
    }

    .deck-area {
      position: relative;
      width: 100%;
      height: 460px;
      max-height: 64dvh;
    }

    .swipe-card {
      position: absolute;
      inset: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      user-select: none;
      touch-action: none;
      transform-origin: 50% 85%;
    }

    .swipe-card.behind {
      transform: scale(0.95) translateY(12px);
      opacity: 0.7;
      pointer-events: none;
    }

    .card-img-wrap {
      flex: 1;
      background: #12151b;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Galerie-Navigation auf der Karte */
    .photo-bars {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      z-index: 6;
      pointer-events: none;
    }

    .photo-bar {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.32);
      transition: background 0.15s ease;
    }

    .photo-bar.active {
      background: #ffffff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
    }

    .photo-counter {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(15, 17, 21, 0.72);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      z-index: 6;
      pointer-events: none;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(15, 17, 21, 0.68);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      line-height: 1;
      padding: 0;
      z-index: 7;
    }

    .nav-arrow.prev {
      left: 10px;
    }

    .nav-arrow.next {
      right: 10px;
    }

    .badge {
      position: absolute;
      top: 26px;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 1px;
      opacity: 0;
      border: 3px solid currentColor;
      pointer-events: none;
      z-index: 8;
      background: rgba(15, 17, 21, 0.45);
    }

    .badge.like {
      left: 18px;
      color: var(--like);
      transform: rotate(-14deg);
    }

    .badge.nope {
      right: 18px;
      color: var(--nope);
      transform: rotate(14deg);
    }

    .card-title-box {
      padding: 16px 18px;
      background: var(--card);
      border-top: 1px solid var(--border);
    }

    .card-title {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.35;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 24px;
      margin-top: 18px;
    }

    .action-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      font-size: 1.5rem;
      display: grid;
      place-items: center;
      background: var(--card);
    }

    .action-btn.nope {
      color: var(--nope);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .action-btn.like {
      color: var(--like);
      border-color: rgba(34, 197, 94, 0.35);
    }

    /* Übersicht & Finale */
    .panel {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #111;
      border-color: transparent;
    }

    .list-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 55dvh;
      overflow-y: auto;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-2);
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .list-item img {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .list-item-title {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.92rem;
    }

    /* Modal für JSON-Import */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #101318;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 180px;
      background: #101318;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      resize: vertical;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label.inline {
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="number"] {
      width: 58px;
      background: #101318;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <strong>Uhren-Edition</strong>
      <span class="round-pill" id="roundLabel">Runde 1</span>
    </div>
    <div class="header-actions">
      <button id="btnView" onclick="toggleView()">Übersicht</button>
      <button onclick="openImport()">Liste / Setup</button>
    </div>
  </header>

  <main id="app"></main>

  <div class="modal-backdrop" id="importModal">
    <div class="modal">
      <strong>Uhren-Liste (JSON) laden</strong>
      <div class="file-row">
        <span><code>uhren_mit_bildern.json</code> direkt auswählen:</span>
        <input type="file" id="jsonFileInput" accept=".json,application/json" onchange="handleFileUpload(event)" />
      </div>
      <span style="font-size:0.82rem;color:var(--muted);">
        Oder den JSON-Inhalt hier einfügen (unterstützt <code>images: [...]</code> und <code>image: "..."</code>):
      </span>
      <textarea id="jsonInput"></textarea>
      <div class="modal-footer">
        <label class="inline">
          Ziel-Anzahl Finale:
          <input type="number" id="targetCountInput" min="1" max="15" value="3" />
        </label>
        <div style="display:flex;gap:8px;">
          <button onclick="closeImport()">Abbrechen</button>
          <button class="primary" onclick="saveImport()">Speichern &amp; Neustart</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SAMPLE_WATCHES = [
      {
        id: 1,
        title: "Klassische Damenarmbanduhr Goldfarbend Minimalistisch",
        images: [
          "https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=900&q=80",
          "https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=900&q=80"
        ]
      },
      {
        id: 2,
        title: "Vintage Lederarmbanduhr Braun Zifferblatt Weiß",
        images: [
          "https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=900&q=80"
        ]
      },
      {
        id: 3,
        title: "Elegante Silberne Uhr Filigranes Armband",
        images: [
          "https://images.unsplash.com/photo-1547996160-81dfa63595aa?auto=format&fit=crop&w=900&q=80"
        ]
      },
      {
        id: 4,
        title: "Moderne Chronographen-Uhr Dunkles Zifferblatt",
        images: [
          "https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?auto=format&fit=crop&w=900&q=80"
        ]
      }
    ];

    const STORAGE_KEY = "uhren_swipe_state_v2";

    let state = loadState();
    let viewMode = "swipe"; // "swipe" | "overview" | "final"
    let activeTab = "liked"; // "liked" | "rejected"
    let currentPhotoIdx = 0;

    function normalizeWatches(list) {
      return list
        .map((item, idx) => {
          if (!item || !item.title) return null;
          let imgs = [];
          if (Array.isArray(item.images)) {
            imgs = item.images.map(u => String(u).trim()).filter(Boolean);
          } else if (typeof item.images === "string" && item.images.trim()) {
            imgs = [item.images.trim()];
          } else if (typeof item.image === "string" && item.image.trim()) {
            imgs = [item.image.trim()];
          }
          if (imgs.length === 0) return null;

          return {
            id: item.id ?? idx + 1,
            title: String(item.title).trim(),
            images: imgs
          };
        })
        .filter(Boolean);
    }

    function defaultState(watches = SAMPLE_WATCHES, targetFinal = 3) {
      const normalized = normalizeWatches(watches);
      return {
        targetFinal,
        round: 1,
        allWatches: normalized,
        queue: [...normalized],
        likedCurrentRound: [],
        rejectedIds: [],
        finished: false
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.allWatches)) {
            parsed.allWatches = normalizeWatches(parsed.allWatches);
            parsed.queue = normalizeWatches(parsed.queue || []);
            return parsed;
          }
        }
      } catch (e) {}
      return defaultState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function getWatchById(id) {
      return state.allWatches.find(w => w.id === id);
    }

    function getPrimaryImage(watch) {
      return (watch && watch.images && watch.images[0]) || "";
    }

    function changePhoto(delta, event) {
      if (event) event.stopPropagation();
      const topWatch = state.queue[0];
      if (!topWatch || !topWatch.images || topWatch.images.length <= 1) return;

      const total = topWatch.images.length;
      currentPhotoIdx = (currentPhotoIdx + delta + total) % total;

      const imgEl = document.getElementById("topCardImg");
      const counterEl = document.getElementById("photoCounter");
      const bars = document.querySelectorAll("#topCard .photo-bar");

      if (imgEl) imgEl.src = topWatch.images[currentPhotoIdx];
      if (counterEl) counterEl.textContent = `${currentPhotoIdx + 1} / ${total}`;
      bars.forEach((b, idx) => b.classList.toggle("active", idx === currentPhotoIdx));
    }

    function handleDecision(liked) {
      if (state.finished || state.queue.length === 0) return;
      const current = state.queue.shift();
      currentPhotoIdx = 0;

      if (liked) {
        state.likedCurrentRound.push(current.id);
        state.rejectedIds = state.rejectedIds.filter(id => id !== current.id);
      } else {
        if (!state.rejectedIds.includes(current.id)) {
          state.rejectedIds.push(current.id);
        }
      }

      if (state.queue.length === 0) {
        const nextPool = state.likedCurrentRound.map(getWatchById).filter(Boolean);

        if (nextPool.length === 0) {
          state.queue = [...state.allWatches.filter(w => !state.rejectedIds.includes(w.id))];
          if (state.queue.length === 0) {
            state.queue = [...state.allWatches];
            state.rejectedIds = [];
          }
          state.likedCurrentRound = [];
        } else if (nextPool.length <= state.targetFinal) {
          state.queue = nextPool;
          state.finished = true;
          viewMode = "final";
        } else {
          state.round += 1;
          state.queue = nextPool;
          state.likedCurrentRound = [];
        }
      }

      saveState();
      render();
    }

    function restoreWatch(id) {
      state.rejectedIds = state.rejectedIds.filter(x => x !== id);
      if (!state.queue.some(w => w.id === id) && !state.likedCurrentRound.includes(id)) {
        state.queue.push(getWatchById(id));
      }
      if (state.finished) {
        state.finished = false;
        viewMode = "swipe";
      }
      saveState();
      render();
    }

    function toggleView() {
      if (state.finished) {
        viewMode = viewMode === "final" ? "overview" : "final";
      } else {
        viewMode = viewMode === "swipe" ? "overview" : "swipe";
      }
      render();
    }

    function render() {
      const app = document.getElementById("app");
      const roundLabel = document.getElementById("roundLabel");
      const btnView = document.getElementById("btnView");

      roundLabel.textContent = state.finished
        ? `Finale (Top ${state.queue.length})`
        : `Runde ${state.round} · Ziel: Top ${state.targetFinal}`;

      btnView.textContent = viewMode === "overview" ? "Zurück zum Spiel" : "Übersicht";

      if (viewMode === "overview") {
        renderOverview(app);
        return;
      }

      if (state.finished || viewMode === "final") {
        renderFinal(app);
        return;
      }

      renderSwipe(app);
    }

    function renderSwipe(app) {
      const totalInRound = state.queue.length + state.likedCurrentRound.length;
      const doneInRound = state.likedCurrentRound.length;
      const pct = totalInRound > 0 ? Math.round((doneInRound / totalInRound) * 100) : 0;

      const topCard = state.queue[0];
      const nextCard = state.queue[1];

      if (topCard && currentPhotoIdx >= topCard.images.length) {
        currentPhotoIdx = 0;
      }

      app.innerHTML = `
        <div class="progress-wrap">
          <div class="progress-meta">
            <span>Noch ${state.queue.length} in dieser Runde</span>
            <span>${state.likedCurrentRound.length} geliked</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
        </div>

        <div class="deck-area" id="deck">
          ${nextCard ? renderCardHtml(nextCard, true) : ""}
          ${topCard ? renderCardHtml(topCard, false) : ""}
        </div>

        <div class="controls">
          <button class="action-btn nope" onclick="handleDecision(false)" title="Rauswählen">✕</button>
          <button class="action-btn like" onclick="handleDecision(true)" title="Liken">♥</button>
        </div>
      `;

      if (topCard) {
        attachDrag(document.getElementById("topCard"));
      }
    }

    function renderCardHtml(watch, isBehind) {
      const imgs = watch.images || [];
      const activeIdx = isBehind ? 0 : currentPhotoIdx;
      const activeImg = imgs[activeIdx] || imgs[0] || "";
      const hasMultiple = imgs.length > 1;

      const galleryUi = (!isBehind && hasMultiple)
        ? `
          <div class="photo-bars">
            ${imgs.map((_, i) => `<div class="photo-bar ${i === activeIdx ? "active" : ""}"></div>`).join("")}
          </div>
          <button type="button" class="nav-arrow prev" onpointerdown="event.stopPropagation()" onclick="changePhoto(-1, event)" title="Vorheriges Bild">‹</button>
          <button type="button" class="nav-arrow next" onpointerdown="event.stopPropagation()" onclick="changePhoto(1, event)" title="Nächstes Bild">›</button>
          <div class="photo-counter" id="photoCounter">${activeIdx + 1} / ${imgs.length}</div>
        `
        : "";

      return `
        <div class="swipe-card ${isBehind ? "behind" : ""}" id="${isBehind ? "nextCard" : "topCard"}">
          <div class="card-img-wrap">
            ${galleryUi}
            <div class="badge like">LIKE</div>
            <div class="badge nope">RAUS</div>
            <img id="${isBehind ? "" : "topCardImg"}" src="${escapeAttr(activeImg)}" alt="${escapeAttr(watch.title)}" loading="eager" />
          </div>
          <div class="card-title-box">
            <h2 class="card-title">${escapeHtml(watch.title)}</h2>
          </div>
        </div>
      `;
    }

    function attachDrag(card) {
      let startX = 0, startY = 0, currentX = 0, dragging = false;
      const likeBadge = card.querySelector(".badge.like");
      const nopeBadge = card.querySelector(".badge.nope");

      const onDown = (e) => {
        if (e.target.closest(".nav-arrow")) return;
        dragging = true;
        const pt = e.touches ? e.touches[0] : e;
        startX = pt.clientX;
        startY = pt.clientY;
        card.style.transition = "none";
      };

      const onMove = (e) => {
        if (!dragging) return;
        const pt = e.touches ? e.touches[0] : e;
        currentX = pt.clientX - startX;
        const currentY = (pt.clientY - startY) * 0.35;
        const rot = currentX * 0.06;

        card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rot}deg)`;

        const ratio = Math.min(Math.abs(currentX) / 110, 1);
        if (currentX > 0) {
          likeBadge.style.opacity = ratio;
          nopeBadge.style.opacity = 0;
        } else {
          nopeBadge.style.opacity = ratio;
          likeBadge.style.opacity = 0;
        }
      };

      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        const threshold = 95;

        if (currentX > threshold) {
          card.style.transition = "transform 0.28s ease, opacity 0.28s ease";
          card.style.transform = "translate(520px, 40px) rotate(22deg)";
          card.style.opacity = "0";
          setTimeout(() => handleDecision(true), 220);
        } else if (currentX < -threshold) {
          card.style.transition = "transform 0.28s ease, opacity 0.28s ease";
          card.style.transform = "translate(-520px, 40px) rotate(-22deg)";
          card.style.opacity = "0";
          setTimeout(() => handleDecision(false), 220);
        } else {
          card.style.transition = "transform 0.25s ease";
          card.style.transform = "";
          likeBadge.style.opacity = 0;
          nopeBadge.style.opacity = 0;
        }
        currentX = 0;
      };

      card.addEventListener("pointerdown", onDown);
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    }

    function renderOverview(app) {
      const stillInIds = new Set([
        ...state.queue.map(w => w.id),
        ...state.likedCurrentRound
      ]);
      const likedList = state.allWatches.filter(w => stillInIds.has(w.id));
      const rejectedList = state.allWatches.filter(w => state.rejectedIds.includes(w.id) && !stillInIds.has(w.id));
      const items = activeTab === "liked" ? likedList : rejectedList;

      app.innerHTML = `
        <div class="panel">
          <div class="tabs">
            <button class="tab-btn ${activeTab === "liked" ? "active" : ""}" onclick="setTab('liked')">
              Noch im Rennen (${likedList.length})
            </button>
            <button class="tab-btn ${activeTab === "rejected" ? "active" : ""}" onclick="setTab('rejected')">
              Rausgevoted (${rejectedList.length})
            </button>
          </div>
          <div class="list-grid">
            ${
              items.length === 0
                ? `<div class="empty-msg">Keine Uhren in dieser Kategorie.</div>`
                : items.map(w => `
                    <div class="list-item">
                      <img src="${escapeAttr(getPrimaryImage(w))}" alt="${escapeAttr(w.title)}" />
                      <div class="list-item-title">${escapeHtml(w.title)}</div>
                      ${
                        activeTab === "rejected"
                          ? `<button onclick="restoreWatch(${w.id})">Zurück</button>`
                          : ""
                      }
                    </div>
                  `).join("")
            }
          </div>
        </div>
      `;
    }

    function renderFinal(app) {
      const winners = state.queue;
      app.innerHTML = `
        <div class="panel">
          <h2 style="margin:0 0 6px;font-size:1.2rem;">Deine Favoriten stehen fest!</h2>
          <p style="margin:0 0 14px;color:var(--muted);font-size:0.88rem;">
            Diese ${winners.length} Uhren haben es bis ins Finale geschafft:
          </p>
          <div class="list-grid">
            ${winners.map((w, idx) => `
              <div class="list-item">
                <strong style="color:var(--accent);font-size:1rem;width:22px;text-align:center;">#${idx + 1}</strong>
                <img src="${escapeAttr(getPrimaryImage(w))}" alt="${escapeAttr(w.title)}" />
                <div class="list-item-title">${escapeHtml(w.title)}</div>
              </div>
            `).join("")}
          </div>
          <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end;">
            <button onclick="restartCurrentWatches()">Nochmal spielen</button>
          </div>
        </div>
      `;
    }

    function setTab(tab) {
      activeTab = tab;
      render();
    }

    function restartCurrentWatches() {
      currentPhotoIdx = 0;
      state = defaultState(state.allWatches, state.targetFinal);
      viewMode = "swipe";
      saveState();
      render();
    }

    function openImport() {
      document.getElementById("jsonInput").value = JSON.stringify(state.allWatches, null, 2);
      document.getElementById("targetCountInput").value = state.targetFinal;
      document.getElementById("importModal").classList.add("open");
    }

    function closeImport() {
      document.getElementById("importModal").classList.remove("open");
    }

    function handleFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById("jsonInput").value = e.target.result || "";
      };
      reader.readAsText(file, "UTF-8");
    }

    function saveImport() {
      const raw = document.getElementById("jsonInput").value.trim();
      const target = Math.max(1, Math.min(15, parseInt(document.getElementById("targetCountInput").value, 10) || 3));
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length === 0) {
          alert("Bitte ein gültiges JSON-Array mit mindestens einer Uhr einfügen.");
          return;
        }
        const cleaned = normalizeWatches(parsed);

        if (cleaned.length === 0) {
          alert("Jeder Eintrag braucht mindestens 'title' und 'images' (oder 'image').");
          return;
        }

        currentPhotoIdx = 0;
        state = defaultState(cleaned, target);
        viewMode = "swipe";
        saveState();
        closeImport();
        render();
      } catch (e) {
        alert("JSON-Format ist ungültig: " + e.message);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    render();
  </script>
</body>
</html>
